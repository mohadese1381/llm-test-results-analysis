<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Analysis Report</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="title-stack">
          <h1 class="title">Test Analysis Report</h1>
          <div class="meta-line">
            <span id="projName" class="meta-item">—</span>
            <span class="dot">•</span>
            <span id="runDate" class="meta-item">—</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn" onclick="window.print()">Print / PDF</button>
        </div>
      </header>

      <!-- compact KPI row -->
      <section class="card card--kpis">
        <div class="kpis">
          <div class="kpi">
            <h4>Total</h4>
            <div class="v" id="kTotal">0</div>
          </div>
          <div class="kpi ok">
            <h4>Passed</h4>
            <div class="v" id="kPassed">0</div>
          </div>
          <div class="kpi err">
            <h4>Failed</h4>
            <div class="v" id="kFailed">0</div>
          </div>
          <div class="kpi warn">
            <h4>Skipped</h4>
            <div class="v" id="kSkipped">0</div>
          </div>
        </div>
      </section>

      <section class="grid">
        <div class="card card-flex">
          <div class="section-title"><h3>Tests Status</h3></div>
          <div class="chart-area">
            <canvas id="testsOverviewChart"></canvas>
          </div>
        </div>
        <div class="card card-flex">
          <div class="section-title"><h3>Failure Types</h3></div>
          <div class="chart-area stick-bottom">
            <canvas id="failureTypesChart"></canvas>
          </div>
        </div>
      </section>

      <!-- equal height row -->
      <section class="grid grid--equal" style="margin-top: 16px">
        <div class="card card-flex">
          <div class="section-title"><h3>Insights</h3></div>
          <p class="section-hint">
            Concise, high-signal observations derived from the LLM analysis.
          </p>
          <div class="table-wrap table-wrap--scroll">
            <table class="table table-compact" id="insightsTable">
              <thead>
                <tr>
                  <th style="width: 30%">Insight</th>
                  <th>Detail</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Risks as bubble chart (title cleaned, chart higher in card) -->
        <div class="card card-flex card--risk">
          <div class="section-title"><h3>Risk Matrix</h3></div>
          <div class="chart-area">
            <canvas id="riskBubblesChart"></canvas>
          </div>
        </div>
      </section>

      <section class="card" style="margin-top: 16px">
        <div class="section-title"><h3>Failed Items</h3></div>
        <div class="table-wrap table-wrap--fail-scroll" id="failWrap">
          <table class="table table-fail" id="failTable">
            <thead>
              <tr>
                <th style="min-width: 220px">Test</th>
                <th style="min-width: 320px">Root Cause</th>
                <th style="min-width: 240px">Location</th>
                <th style="min-width: 280px">Error</th>
                <th style="min-width: 260px">Suggested Fixes</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      const REPORT = {"schemaVersion": "1.0.0", "project": {"name": "pytest-samples", "date": "2025-08-13"}, "metrics": {"total": 29, "passed": 19, "failed": 4, "skipped": 1, "durationSec": 0.0}, "insights": [{"title": "The mock object lacks a spec, causing 'called_once' to be treated as an invalid attribute.", "detail": "2 failing test(s)"}, {"title": "The function does not correctly compute double the input value.", "detail": "1 failing test(s)"}, {"title": "The response JSON does not match the expected empty dictionary.", "detail": "1 failing test(s)"}], "risks": [], "failures": [{"id": "tests/smoke/test_basic.py::test_will_fail", "title": "tests/smoke/test_basic.py::test_will_fail", "type": "unit", "message": "AssertionError: Function should return double of the value\nassert 2 == 4", "root_cause": "The function does not correctly compute double the input value.", "severity": "high", "file": "source/sut.py", "location": "source/sut.py>11", "functions": ["source/sut.py::SystemUnderTest::function"], "suggested_fixes": ["Correct the logic in source/sut.py::SystemUnderTest::function to ensure it returns double the input value.", "Add unit tests to validate the function's behavior for various inputs."]}, {"id": "tests/unit/test_delayed_assert.py::test_delayed_response_with_error", "title": "tests/unit/test_delayed_assert.py::test_delayed_response_with_error", "type": "unit", "message": "AssertionError: Failed Expectations : 1\nErrorMessage: {\"key\": \"value\"}\nexpect(response.json() == {}, response.text)", "root_cause": "The response JSON does not match the expected empty dictionary.", "severity": "medium", "file": "", "location": "", "functions": ["source/sut.py::SystemUnderTest::function"], "suggested_fixes": ["Ensure the response JSON is correctly mocked or adjusted to match the expected format.", "Verify the test setup and response generation logic."]}, {"id": "tests/unit/test_mocks.py::test_mock_patching", "title": "tests/unit/test_mocks.py::test_mock_patching     </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
